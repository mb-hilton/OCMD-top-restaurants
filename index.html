<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocean City Restaurant Guide</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--ink:#14213d;--muted:#64748b;--sea:#087e8b;--sand:#f8f4ec;--card:#fff;--line:#e2e8f0}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
body{display:grid;grid-template-columns:360px 1fr;background:var(--sand)}
#sidebar{height:100vh;overflow:auto;background:rgba(255,255,255,.97);border-right:1px solid var(--line);padding:22px;z-index:1000}
h1{font-size:25px;line-height:1.1;margin:0 0 6px}.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.search{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:11px 13px;font-size:15px;outline:none}.search:focus{border-color:var(--sea);box-shadow:0 0 0 3px rgba(8,126,139,.12)}
.filters{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.filter{border:1px solid var(--line);background:#fff;color:#334155;padding:7px 10px;border-radius:999px;cursor:pointer;font-weight:650;font-size:12px}.filter.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin:14px 2px 8px}
.list{display:grid;gap:8px}.place{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;cursor:pointer;text-align:left}.place:hover,.place:focus{border-color:#94a3b8;box-shadow:0 5px 18px rgba(15,23,42,.08);outline:none}.place strong{display:block;font-size:14px;margin-bottom:3px}.place small{color:var(--muted);line-height:1.3}.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}.tag{font-size:10px;font-weight:700;color:#075985;background:#e0f2fe;border-radius:999px;padding:3px 6px}
#map{height:100vh;width:100%}.leaflet-popup-content-wrapper{border-radius:14px}.popup-title{font-weight:800;font-size:15px;margin-bottom:4px}.popup-address{color:#475569;line-height:1.35}.popup-link{display:inline-block;margin-top:9px;color:#0369a1;font-weight:700;text-decoration:none}
.legend{background:white;padding:9px 11px;border-radius:10px;box-shadow:0 2px 12px rgba(15,23,42,.14);font-size:11px;line-height:1.8}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
@media(max-width:760px){body{display:block}#sidebar{height:auto;max-height:46vh;width:100%;border-right:0;border-bottom:1px solid var(--line);padding:14px}#map{height:54vh}h1{font-size:21px}.list{grid-template-columns:1fr 1fr}.place{padding:9px}.sub{margin-bottom:10px}}
@media(max-width:460px){.list{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside id="sidebar">
  <h1>Ocean City Restaurant Guide</h1>
  <p class="sub">Browse local favorites by category, then select a restaurant to view its exact mapped location.</p>
  <input id="search" class="search" type="search" placeholder="Search restaurants or addresses" aria-label="Search restaurants">
  <div id="filters" class="filters" aria-label="Restaurant categories"></div>
  <div class="meta"><span id="count"></span><button id="reset" class="filter" type="button">Reset map</button></div>
  <div id="list" class="list"></div>
</aside>
<main id="map" aria-label="Interactive map of Ocean City restaurants"></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const restaurants = [{"name": "Harrison's Harbor Watch", "address": "806 S Atlantic Ave, Ocean City, MD 21842", "lat": 38.325554, "lng": -75.08817, "categories": ["Raw Bar"]}, {"name": "BLU Crabhouse & Raw Bar", "address": "2305 Philadelphia Ave, Ocean City, MD 21842", "lat": 38.35341, "lng": -75.07747, "categories": ["Raw Bar"]}, {"name": "On the Bay Seafood", "address": "4204 Coastal Hwy, Ocean City, MD 21842", "lat": 38.36918, "lng": -75.07065, "categories": ["Raw Bar", "Seafood"]}, {"name": "Ropewalk Ocean City", "address": "8203 Coastal Hwy, Ocean City, MD 21842", "lat": 38.401966, "lng": -75.06222, "categories": ["Raw Bar", "Kid-Friendly"]}, {"name": "The Crab Bag", "address": "13005 Coastal Hwy, Ocean City, MD 21842", "lat": 38.436073, "lng": -75.05474, "categories": ["Steamed Crabs"]}, {"name": "Hooper's Crab House", "address": "12913 Ocean Gateway, Ocean City, MD 21842", "lat": 38.33501, "lng": -75.09864, "categories": ["Steamed Crabs"]}, {"name": "PGN Crab House", "address": "2906 Philadelphia Ave, Ocean City, MD 21842", "lat": 38.358376, "lng": -75.073845, "categories": ["Steamed Crabs"]}, {"name": "OCM Crabs", "address": "7111 Coastal Hwy, Ocean City, MD 21842", "lat": 38.3863, "lng": -75.0672, "categories": ["Steamed Crabs"]}, {"name": "Blue Fish Restaurant & Bar", "address": "9401 Coastal Hwy, Ocean City, MD 21842", "lat": 38.40987, "lng": -75.058975, "categories": ["Sushi"]}, {"name": "Sushi Cafe", "address": "13711 Coastal Hwy, Ocean City, MD 21842", "lat": 38.44286, "lng": -75.05395, "categories": ["Sushi"]}, {"name": "OC Wasabi", "address": "3316 Coastal Hwy, Ocean City, MD 21842", "lat": 38.362026, "lng": -75.0725, "categories": ["Sushi"]}, {"name": "Nori Sushi Bar & Grill", "address": "11403 Coastal Hwy, Ocean City, MD 21842", "lat": 38.419815, "lng": -75.05783, "categories": ["Sushi"]}, {"name": "The Bayside Skillet", "address": "7701 Coastal Hwy, Ocean City, MD 21842", "lat": 38.397278, "lng": -75.06279, "categories": ["Breakfast"]}, {"name": "Malia's Cafe", "address": "1800 N Baltimore Ave, Ocean City, MD 21842", "lat": 38.34773, "lng": -75.07733, "categories": ["Breakfast"]}, {"name": "Barn 34", "address": "3400 Coastal Hwy, Ocean City, MD 21842", "lat": 38.362606, "lng": -75.07237, "categories": ["Breakfast"]}, {"name": "Happy Jack Pancake House", "address": "2504 Philadelphia Ave, Ocean City, MD 21842", "lat": 38.35478, "lng": -75.07558, "categories": ["Breakfast"]}, {"name": "Sahara Cafe", "address": "1901 N Baltimore Ave, Ocean City, MD 21842", "lat": 38.348827, "lng": -75.077675, "categories": ["Breakfast"]}, {"name": "Trattoria Lombardi's", "address": "9203 Coastal Hwy, Ocean City, MD 21842", "lat": 38.40838, "lng": -75.05948, "categories": ["Italian"]}, {"name": "Ristorante Antipasti", "address": "3101 Philadelphia Ave, Ocean City, MD 21842", "lat": 38.3601, "lng": -75.07407, "categories": ["Italian"]}, {"name": "Sello's Italian Oven & Bar", "address": "9802 Golf Course Rd, Ocean City, MD 21842", "lat": 38.330334, "lng": -75.10655, "categories": ["Italian"]}, {"name": "Ripieno's Italian Bistro", "address": "3205 Coastal Hwy, Ocean City, MD 21842", "lat": 38.361458, "lng": -75.07373, "categories": ["Italian"]}, {"name": "Albertino's Brick Oven Eatery", "address": "13117 Coastal Hwy, Ocean City, MD 21842", "lat": 38.43736, "lng": -75.05498, "categories": ["Italian"]}, {"name": "The Shark on the Harbor", "address": "12924 Sunset Ave, Ocean City, MD 21842", "lat": 38.327656, "lng": -75.10255, "categories": ["Seafood"]}, {"name": "Sunset Grille", "address": "12933 Sunset Ave, Ocean City, MD 21842", "lat": 38.32825, "lng": -75.10148, "categories": ["Seafood", "Ambiance"]}, {"name": "Hooked", "address": "8003 Coastal Hwy, Ocean City, MD 21842", "lat": 38.399765, "lng": -75.06207, "categories": ["Seafood"]}, {"name": "Coastal Salt", "address": "1601 Atlantic Ave, Ocean City, MD 21842", "lat": 38.34579, "lng": -75.077545, "categories": ["Seafood", "Ambiance"]}, {"name": "Fish Tales", "address": "2107 Herring Way, Ocean City, MD 21842", "lat": 38.351746, "lng": -75.07835, "categories": ["Kid-Friendly"]}, {"name": "Dead Freddies Island Grill", "address": "105 64th St, Ocean City, MD 21842", "lat": 38.386623, "lng": -75.06695, "categories": ["Kid-Friendly"]}, {"name": "de Lazy Lizard", "address": "302 1st St, Ocean City, MD 21842", "lat": 38.333805, "lng": -75.088455, "categories": ["Kid-Friendly"]}, {"name": "Macky's Bayside Bar & Grill", "address": "5311 Coastal Hwy, Ocean City, MD 21842", "lat": 38.37896, "lng": -75.070786, "categories": ["Kid-Friendly"]}, {"name": "The Hobbit Restaurant", "address": "121 81st St #101, Ocean City, MD 21842", "lat": 38.400406, "lng": -75.06323, "categories": ["Ambiance"]}, {"name": "Fager's Island", "address": "201 60th St, Ocean City, MD 21842", "lat": 38.38309, "lng": -75.07074, "categories": ["Ambiance"]}, {"name": "Spain Wine Bar", "address": "13 St Louis Ave, Ocean City, MD 21842", "lat": 38.333046, "lng": -75.08954, "categories": ["Ambiance"]}];
const colors={"Raw Bar":"#2563eb","Steamed Crabs":"#dc2626","Sushi":"#7c3aed","Breakfast":"#ea580c","Italian":"#16a34a","Seafood":"#075985","Kid-Friendly":"#0891b2","Ambiance":"#db2777"};
const map=L.map('map',{zoomControl:true}).setView([38.376,-75.074],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const allBounds=L.latLngBounds(restaurants.map(r=>[r.lat,r.lng]));
const markerLayer=L.layerGroup().addTo(map); let active='All'; let markers=new Map();
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function markerIcon(r){const c=colors[r.categories[0]]||'#334155';return L.divIcon({className:'',html:`<div style="width:24px;height:24px;border-radius:50% 50% 50% 0;background:${c};border:3px solid white;box-shadow:0 2px 7px #0005;transform:rotate(-45deg)"><div style="width:6px;height:6px;border-radius:50%;background:#fff;margin:6px"></div></div>`,iconSize:[24,24],iconAnchor:[12,24],popupAnchor:[0,-23]})}
function visible(){const q=document.getElementById('search').value.trim().toLowerCase();return restaurants.filter(r=>(active==='All'||r.categories.includes(active))&&(!q||r.name.toLowerCase().includes(q)||r.address.toLowerCase().includes(q)))}
function render(){const rows=visible();markerLayer.clearLayers();markers.clear();const list=document.getElementById('list');list.innerHTML='';rows.forEach(r=>{const m=L.marker([r.lat,r.lng],{icon:markerIcon(r),title:r.name}).bindPopup(`<div class="popup-title">${esc(r.name)}</div><div class="popup-address">${esc(r.address)}</div><div class="tags">${r.categories.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div><a class="popup-link" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.address)}">Open directions</a>`).addTo(markerLayer);markers.set(r.name,m);const b=document.createElement('button');b.type='button';b.className='place';b.innerHTML=`<strong>${esc(r.name)}</strong><small>${esc(r.address)}</small><div class="tags">${r.categories.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div>`;b.onclick=()=>{map.setView([r.lat,r.lng],16);m.openPopup()};list.appendChild(b)});document.getElementById('count').textContent=`${rows.length} restaurant${rows.length===1?'':'s'}`;if(rows.length) map.fitBounds(L.latLngBounds(rows.map(r=>[r.lat,r.lng])),{padding:[35,35],maxZoom:14})}
const cats=['All',...Object.keys(colors)];const filters=document.getElementById('filters');cats.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='filter'+(c==='All'?' active':'');b.textContent=c;b.onclick=()=>{active=c;document.querySelectorAll('#filters .filter').forEach(x=>x.classList.toggle('active',x===b));render()};filters.appendChild(b)});
document.getElementById('search').addEventListener('input',render);document.getElementById('reset').onclick=()=>{active='All';document.getElementById('search').value='';document.querySelectorAll('#filters .filter').forEach((x,i)=>x.classList.toggle('active',i===0));render();map.fitBounds(allBounds,{padding:[35,35]})};
const legend=L.control({position:'bottomright'});legend.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML=Object.entries(colors).map(([k,v])=>`<div><span class="dot" style="background:${v}"></span>${k}</div>`).join('');return d};legend.addTo(map);
render();
</script>
</body>
</html>
